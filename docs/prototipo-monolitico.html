<!-- Tailwind (utilidades CSS) -->

<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
  .carga-error { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; font-family:sans-serif; }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#6B7568;">
    Cargando…
  </div>
</div>

<script>
  // Si algo falla al cargar (sin internet, CDN bloqueado, etc.) mostramos el motivo
  // en vez de dejar la pantalla de "Cargando" para siempre.
  function mostrarErrorCarga(mensaje) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML =
      '<div class="carga-error"><div>' +
      '<p style="font-weight:600;margin-bottom:8px;color:#B14A3A;">No se pudo cargar la app</p>' +
      '<p style="font-size:13px;color:#374151;max-width:420px;">' + mensaje + '</p>' +
      '<p style="font-size:12px;color:#6B7568;margin-top:10px;max-width:420px;">Esta pagina necesita conexion a internet la primera vez que se abre (para traer React, Tailwind y otras librerias). Revisa tu conexion, desactiva bloqueadores de anuncios/scripts para este archivo, o pruebalo en otro navegador.</p>' +
      '</div></div>';
  }
  function errorDeRecurso(nombre) {
    return function () {
      mostrarErrorCarga("No se pudo descargar <b>" + nombre + "</b> desde el CDN.");
    };
  }
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && root.textContent.indexOf("Cargando") !== -1) {
      mostrarErrorCarga("Ocurrio un error al iniciar la app: " + (e.message || "error desconocido") + ".");
    }
  });
</script>

<!-- React + ReactDOM -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="errorDeRecurso('React')()"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onerror="errorDeRecurso('ReactDOM')()"></script>

<!-- Babel Standalone: permite escribir JSX directo en el navegador -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js" onerror="errorDeRecurso('Babel')()"></script>

<!-- SheetJS: lectura de archivos Excel -->
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" onerror="errorDeRecurso('SheetJS (xlsx)')()"></script>

<!-- Lucide (version vanilla): fuente de los iconos -->
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js" onerror="errorDeRecurso('Lucide')()"></script>

<script>
  // Verificacion final: si alguna libreria no quedo disponible, avisamos con claridad.
  window.addEventListener("load", function () {
    setTimeout(function () {
      var faltantes = [];
      if (typeof React === "undefined") faltantes.push("React");
      if (typeof ReactDOM === "undefined") faltantes.push("ReactDOM");
      if (typeof Babel === "undefined") faltantes.push("Babel");
      if (typeof XLSX === "undefined") faltantes.push("XLSX");
      if (typeof lucide === "undefined") faltantes.push("Lucide");
      if (faltantes.length) {
        mostrarErrorCarga("No se cargaron estas librerias: <b>" + faltantes.join(", ") + "</b>.");
      }
    }, 3000);
  });
</script>

// ---------- shim de iconos: recrea los componentes de lucide-react a partir de la libreria vanilla "lucide" ----------
function makeIcon(iconName) {
  return function LucideIcon({ size = 24, style = {}, className }) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      el.innerHTML = "";
      const iconNode = window.lucide && window.lucide.icons ? window.lucide.icons[iconName] : null;
      if (!iconNode) return;
      const svg = window.lucide.createElement(iconNode, {
        width: size,
        height: size,
        "stroke-width": 2,
      });
      svg.style.display = "block";
      el.appendChild(svg);
    }, [size, iconName]);
    return React.createElement("span", {
      ref,
      className,
      style: { display: "inline-flex", lineHeight: 0, flexShrink: 0, ...style },
    });
  };
}

// ---------- utilidades ----------
const money = (n) =>
  "$" + Number(n || 0).toLocaleString("es-CO", { minimumFractionDigits: 0, maximumFractionDigits: 0 });

const normalize = (s) =>
  String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

const digits = (s) => String(s || "").replace(/\D/g, "");

const toNumber = (v) => Number(String(v ?? "").replace(/[^0-9.,]/g, "").replace(",", ".")) || 0;

const fechaHoraCorta = (d) =>
  `${d.toLocaleDateString("es-CO", { day: "2-digit", month: "2-digit" })} ${d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;

function hexToRgba(hex, alpha) {
  const h = String(hex || "#000000").replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function iconForCategoria(cat) {
  const c = normalize(cat);
  if (/(fruta|verdura|vegetal)/.test(c)) return Apple;
  if (/(bebida|jugo|gaseosa|soda|licor)/.test(c)) return CupSoda;
  if (/(lacte|leche|queso|yogur)/.test(c)) return Milk;
  if (/(pan|panaderia|repost)/.test(c)) return Wheat;
  if (/(carne|pollo|res|cerdo|pescad)/.test(c)) return Beef;
  if (/(limpieza|aseo|hogar)/.test(c)) return SprayCan;
  if (/(dulce|snack|golosin|confit)/.test(c)) return Candy;
  return Package;
}

// clasifica el encabezado de una columna del excel a un campo interno
function classifyHeader(key) {
  const k = normalize(key);
  if (k.includes("categ")) return "categoria";
  if (k.includes("marca")) return "marca";
  if (k.includes("unidad")) return "unidad";
  if (k.includes("proveedor")) return "proveedor";
  if (k.includes("costo")) return "precioCosto";
  if (k.includes("venta") || (k.includes("precio") && !k.includes("costo"))) return "precioVenta";
  if (k.includes("produc") || k === "nombre") return "producto";
  return null;
}

// ---------- horario de servicio ----------
const DIAS = [
  { key: "lun", label: "Lun", idx: 1 },
  { key: "mar", label: "Mar", idx: 2 },
  { key: "mie", label: "Mié", idx: 3 },
  { key: "jue", label: "Jue", idx: 4 },
  { key: "vie", label: "Vie", idx: 5 },
  { key: "sab", label: "Sáb", idx: 6 },
  { key: "dom", label: "Dom", idx: 0 },
];
const NOMBRE_DIA = { 0: "Domingo", 1: "Lunes", 2: "Martes", 3: "Miércoles", 4: "Jueves", 5: "Viernes", 6: "Sábado" };
const KEY_POR_IDX = { 0: "dom", 1: "lun", 2: "mar", 3: "mie", 4: "jue", 5: "vie", 6: "sab" };

function minutosDeHora(hhmm) {
  const [h, m] = String(hhmm || "0:0").split(":").map(Number);
  return h * 60 + (m || 0);
}

// true si el turno cruza la medianoche (ej. taqueria de 18:00 a 02:00)
function cruzaMedianoche(horario) {
  return minutosDeHora(horario.cierre) < minutosDeHora(horario.apertura);
}

function estaEnHorario(horario, fecha = new Date()) {
  const apertura = minutosDeHora(horario.apertura);
  const cierre = minutosDeHora(horario.cierre);
  const min = fecha.getHours() * 60 + fecha.getMinutes();
  const abiertoHoy = !!horario.dias[KEY_POR_IDX[fecha.getDay()]];

  // horario normal: apertura y cierre caen el mismo dia
  if (cierre >= apertura) return abiertoHoy && min >= apertura && min <= cierre;

  // horario nocturno: el turno arranca un dia y termina en la madrugada del siguiente.
  // El dia marcado en "Dias con servicio" es el dia en que ABRE el turno.
  if (min >= apertura) return abiertoHoy; // turno que abrio hoy y sigue corriendo
  if (min <= cierre) {                    // madrugada del turno que abrio ayer
    const ayer = new Date(fecha);
    ayer.setDate(ayer.getDate() - 1);
    return !!horario.dias[KEY_POR_IDX[ayer.getDay()]];
  }
  return false;
}

// calcula el texto y la fecha del próximo horario de atención disponible
function proximaAtencion(horario, fecha = new Date()) {
  const aperturaMin = minutosDeHora(horario.apertura);
  for (let add = 0; add <= 7; add++) {
    const d = new Date(fecha);
    d.setDate(d.getDate() + add);
    const key = KEY_POR_IDX[d.getDay()];
    if (!horario.dias[key]) continue;
    const aperturaDate = new Date(d);
    aperturaDate.setHours(Math.floor(aperturaMin / 60), aperturaMin % 60, 0, 0);
    if (add === 0 && fecha >= aperturaDate) continue; // hoy ya pasó el horario de apertura
    const texto = add === 0 ? `hoy a partir de las ${horario.apertura}` : add === 1 ? `mañana a partir de las ${horario.apertura}` : `el ${NOMBRE_DIA[d.getDay()]} a partir de las ${horario.apertura}`;
    return { texto, fecha: aperturaDate };
  }
  return { texto: "próximamente", fecha: null };
}

function paletteForCategoria(cat) {
  const palettes = [
    { bg: "#EAF2E7", ink: "#2F6B4F" },
    { bg: "#FCEFD9", ink: "#B5732B" },
    { bg: "#F1E7F5", ink: "#7A4E8C" },
    { bg: "#E4EEF6", ink: "#2E6488" },
    { bg: "#FCE6E2", ink: "#B14A3A" },
    { bg: "#EEF0DA", ink: "#5E6B2E" },
  ];
  let hash = 0;
  const c = normalize(cat);
  for (let i = 0; i < c.length; i++) hash = (hash * 31 + c.charCodeAt(i)) >>> 0;
  return palettes[hash % palettes.length];
}

    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(texto);
    }
    return new Promise((resolve, reject) => {
      try {
        const ta = document.createElement("textarea");
        ta.value = texto;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();

        document.execCommand("copy");

    });

    if (!navigator.geolocation) {
      setDireccionGpsError("Tu navegador no soporta geolocalización.");
      return;
    }
    setDireccionGpsError("");
    setDireccionGpsCargando(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setDireccionGps({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        setDireccionGpsCargando(false);
      },
      () => {
        setDireccionGpsError("No pudimos obtener tu ubicación. Revisa los permisos del navegador.");
        setDireccionGpsCargando(false);
      }
    );
  }

  // arma el mensaje y muestra la pantalla de confirmación; el pedido todavía no
  // queda registrado ni se limpia el carrito hasta que se envía por WhatsApp,
  // para poder volver atrás y editarlo si hace falta.
  function finalizarPedido() {
    if (!clienteActivo) { setView("catalogo"); return; }
    if (entrega === "domicilio" && !direccion.trim()) { setCheckoutError("Escribe la dirección de entrega."); return; }
    setCheckoutError("");

    const { nombre, telefono } = clienteActivo;
    const lineas = itemsCarrito.map(
      (i) => `• ${i.cantidad} ${i.unidad} — ${i.producto} (${money(i.precioVenta)} c/u) = ${money(i.precioVenta * i.cantidad)}`
    );
    const entregaTexto = entrega === "recoger" ? "Recoger en tienda" : `Entrega a domicilio — ${direccion.trim()}`;
    const pagoTexto = { efectivo: "Efectivo", transferencia: "Transferencia", tarjeta: "Tarjeta contra entrega" }[pago];
    const ubicacionTexto = entrega === "domicilio" && direccionGps
      ? `Ubicación: https://www.google.com/maps?q=${direccionGps.lat},${direccionGps.lng}` : null;

    const mensaje = [
      `¡Hola! Soy *${nombre}* 👋`,
      `*Mi teléfono:* ${telefono}`,
      ``,
      `Quiero hacer el siguiente pedido:`,
      ...lineas,
      recargoAplicado ? `Recargo por atención fuera de horario (+${horario.recargo}%): ${money(recargoMonto)}` : null,
      ``,
      `*Total: ${money(totalConRecargo)}*`,
      ``,
      `*Entrega:* ${entregaTexto}`,
      ubicacionTexto,
      `*Forma de pago:* ${pagoTexto}`,
      comentarios.trim() ? `*Comentarios:* ${comentarios.trim()}` : null,
    ].filter(Boolean).join("\n");

    const utilidadPedido = itemsCarrito.reduce((s, i) => s + (i.precioVenta - i.precioCosto) * i.cantidad, 0) + recargoMonto;
    setPedidoFinal({
      nombre, telefono, items: itemsCarrito, total: totalConRecargo, utilidad: utilidadPedido,
      entrega: entregaTexto, pago: pagoTexto, comentarios: comentarios.trim(), mensaje,
      direccion: entrega === "domicilio" ? direccion.trim() : "", direccionGps: entrega === "domicilio" ? direccionGps : null,
    });
    setPedidoEnviado(false); // este pedido todavia no se envio, aunque el anterior si
    setView("confirmacion");
  }

  // se llama al volver a Tienda/Carrito desde la confirmación para corregir el pedido:
  // no borra nada, solo regresa (el pedido aún no se registró ni se limpió el carrito)
  function editarPedido() {
    setView("checkout");
  }

  // abre WhatsApp con el mensaje ya armado. No registra nada: se puede llamar
  // otra vez si el usuario cerro la pestana de WhatsApp por error.
  function abrirWhatsapp() {
    const numero = digits(negocioTelefono);
    if (!numero || !pedidoFinal) return;
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(pedidoFinal.mensaje)}`;
    window.open(url, "_blank");
  }

  // esto es lo que realmente "termina" el pedido: registra la venta, recuerda la
  // dirección del cliente y limpia el carrito y el formulario.
  // Corre UNA sola vez por pedido: "pedidoEnviado" bloquea el segundo clic (o el
  // doble toque en movil) que si no registraria la misma venta dos veces.
  function enviarWhatsapp() {
    const numero = digits(negocioTelefono);
    if (!numero || !pedidoFinal || pedidoEnviado) return;

    const ahora = new Date();
    setPedidos((prev) => [...prev, {
      id: Date.now(), nombre: pedidoFinal.nombre, telefono: pedidoFinal.telefono,
      total: pedidoFinal.total, utilidad: pedidoFinal.utilidad,
      fecha: ahora.toLocaleString("es-CO"), fechaISO: ahora.toISOString(), items: pedidoFinal.items,
    }]);

    if (pedidoFinal.direccion) {
      setDireccionesClientes((prev) => ({
        ...prev,
        [digits(pedidoFinal.telefono)]: { direccion: pedidoFinal.direccion, gps: pedidoFinal.direccionGps || null },
      }));
    }

    setPedidoEnviado(true);
    abrirWhatsapp();

    // pedido terminado: limpiar carrito y formulario para el siguiente
    setCart({});
    limpiarDatosPedido();
  }

  function nuevoPedido() {
    setCart({});
    limpiarDatosPedido();
    setPedidoFinal(null);
    setPedidoEnviado(false);
    setView("catalogo");
  }

  // ---------- finanzas (utilidad real = venta - costo) ----------
  const [periodoFinanzas, setPeriodoFinanzas] = useState("dia"); // dia | semana | mes

  function inicioSemana(fecha) {
    const d = new Date(fecha);
    const dia = d.getDay(); // 0 = domingo
    const diff = (dia === 0 ? -6 : 1) - dia; // arranca en lunes
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  const finanzas = useMemo(() => {
    const ahora = new Date();
    const hoy = ahora.toDateString();
    const mesActual = ahora.getMonth();
    const anioActual = ahora.getFullYear();
    const iniSemana = inicioSemana(ahora);
    const finSemana = new Date(iniSemana);
    finSemana.setDate(finSemana.getDate() + 7);

    function filtrarPorPeriodo(periodo) {
      return pedidos.filter((p) => {
        const d = new Date(p.fechaISO);
        if (periodo === "dia") return d.toDateString() === hoy;
        if (periodo === "semana") return d >= iniSemana && d < finSemana;
        return d.getMonth() === mesActual && d.getFullYear() === anioActual;
      });
    }

    const resumenPorPeriodo = {};
    ["dia", "semana", "mes"].forEach((periodo) => {
      const filtrados = filtrarPorPeriodo(periodo);
      resumenPorPeriodo[periodo] = {
        ingresos: filtrados.reduce((s, p) => s + p.total, 0),
        utilidad: filtrados.reduce((s, p) => s + p.utilidad, 0),
        pedidos: filtrados.length,
      };
    });

    const sinCosto = productos.some((p) => p.producto.trim() && !p.precioCosto);

    return {
      resumenPorPeriodo,
      sinCosto,
    };
  }, [pedidos, productos]);

  const hoyISO = () => new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD en horario local

  function filtrarPorRango(lista, desdeStr, hastaStr) {
    const desde = desdeStr ? new Date(`${desdeStr}T00:00:00`) : null;
    const hasta = hastaStr ? new Date(`${hastaStr}T23:59:59`) : null;
    return lista.filter((p) => {
      const d = new Date(p.fechaISO);
      if (desde && d < desde) return false;
      if (hasta && d > hasta) return false;
      return true;
    });
  }

  // ingresos del día, con selector de rango (por defecto: hoy)
  const [ingresosDesde, setIngresosDesde] = useState(hoyISO());
  const [ingresosHasta, setIngresosHasta] = useState(hoyISO());

  const ingresosPedidosFiltrados = useMemo(
    () => filtrarPorRango(pedidos, ingresosDesde, ingresosHasta).slice().reverse(),
    [pedidos, ingresosDesde, ingresosHasta]
  );

  // utilidad por pedido, con selector de rango (por defecto: todos)
  const [pedidosDesde, setPedidosDesde] = useState("");
  const [pedidosHasta, setPedidosHasta] = useState("");

  const pedidosFiltrados = useMemo(
    () => filtrarPorRango(pedidos, pedidosDesde, pedidosHasta).slice().reverse(),
    [pedidos, pedidosDesde, pedidosHasta]
  );

  // utilidad por cliente con selector de rango de fechas: Total = suma de (precio venta - precio costo) de todos sus pedidos
  const [clientesDesde, setClientesDesde] = useState("");
  const [clientesHasta, setClientesHasta] = useState("");

  const porClienteFiltrado = useMemo(() => {
    const filtrados = filtrarPorRango(pedidos, clientesDesde, clientesHasta);
    const map = new Map();
    filtrados.forEach((p) => {
      const k = digits(p.telefono) || p.nombre;
      const prev = map.get(k) || { nombre: p.nombre, telefono: p.telefono, pedidos: 0, total: 0 };
      prev.nombre = p.nombre;
      prev.pedidos += 1;
      prev.total += p.utilidad; // suma de todas las utilidades (venta - costo) de sus pedidos
      map.set(k, prev);
    });
    return Array.from(map.values()).sort((a, b) => b.total - a.total);
  }, [pedidos, clientesDesde, clientesHasta]);

            </div>

            <div className="rounded-2xl p-4 mb-6 space-y-3" style={{ background: "var(--card)", border: "1px solid var(--border)" }}>
              <p className="text-xs font-semibold flex items-center gap-1.5"><Landmark size={13} /> Datos bancarios</p>
              <p className="text-[11px]" style={{ color: "var(--muted)" }}>Se muestran al cliente cuando elige pagar por transferencia.</p>
              <div>
                <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Banco</label>
                <input value={bancoNombre} onChange={(e) => setBancoNombre(e.target.value)} placeholder="Ej: Bancolombia"
                  className="w-full rounded-lg px-3 py-2.5 text-sm outline-none" style={{ border: "1px solid var(--border)", background: "var(--bg)", color: "var(--ink)" }} />
              </div>
              <div>
                <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Beneficiario</label>
                <input value={bancoBeneficiario} onChange={(e) => setBancoBeneficiario(e.target.value)} placeholder="Nombre a quien está la cuenta"
                  className="w-full rounded-lg px-3 py-2.5 text-sm outline-none" style={{ border: "1px solid var(--border)", background: "var(--bg)", color: "var(--ink)" }} />
              </div>
              <div>
                <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Número de tarjeta o cuenta</label>
                <div className="flex items-center gap-2">
                  <input value={bancoNumeroCuenta} onChange={(e) => setBancoNumeroCuenta(e.target.value)} placeholder="Ej: 1234 5678 9012 3456"
                    className="flex-1 rounded-lg px-3 py-2.5 text-sm outline-none font-mono-price" style={{ border: "1px solid var(--border)", background: "var(--bg)", color: "var(--ink)" }} />
                  <button onClick={copiarNumeroCuenta} disabled={!bancoNumeroCuenta} className="flex-shrink-0 rounded-lg px-3 py-2.5 text-xs font-semibold flex items-center gap-1 disabled:opacity-40"
                    style={{ border: "1px solid var(--border)", color: "var(--ink)" }}>
                    <Copy size={13} /> {copiadoCuenta ? "¡Copiado!" : "Copiar"}
                  </button>
                </div>
              </div>
            </div>

            <div>
              <p className="text-xs font-semibold flex items-center gap-1.5 mb-1"><ImageIcon size={13} /> Cambiar imagen (skin)</p>
              <p className="text-[11px] mb-3" style={{ color: "var(--muted)" }}>Elige el fondo que más se parezca a tu negocio.</p>
              <div className="grid grid-cols-2 gap-3">
                {SKINS.map((s) => {
                  const IconoSkin = ICONO_SKIN[s.icono];
                  return (
                    <button key={s.id} onClick={() => setSkinId(s.id)} className="rounded-xl p-3 text-left transition"
                      style={{ background: "var(--card)", border: s.id === skinId ? "2px solid var(--primary)" : "1px solid var(--border)" }}>
                      <div className="flex mb-2 h-14 rounded-md overflow-hidden relative">
                        {s.foto ? (
                          <img src={s.foto} alt={s.nombre} className="w-full h-full object-cover" />
                        ) : (
                          <>
                            {s.swatch.map((c, i) => <div key={i} style={{ background: c, flex: 1 }} />)}
                            {IconoSkin && (
                              <div className="absolute inset-0 flex items-center justify-center">
                                <IconoSkin size={22} style={{ color: "#fff", filter: "drop-shadow(0 1px 2px rgba(0,0,0,0.35))" }} />
                              </div>
                            )}
                          </>
                        )}
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold">{s.nombre}</span>
                        {s.id === skinId && <Check size={13} style={{ color: "var(--primary)" }} />}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* ---------- FINANZAS ---------- */}
        {view === "finanzas" && (
          <div className="max-w-md mx-auto">
            <h1 className="font-display text-3xl mb-2">Finanzas</h1>
            <p className="text-sm mb-4" style={{ color: "var(--muted)" }}>
              La utilidad se calcula con el precio de costo y el precio de venta de cada producto vendido.
            </p>
            {finanzas.sinCosto && (
              <p className="text-xs mb-4 flex items-center gap-1.5 rounded-lg px-3 py-2" style={{ color: "#B5732B", background: "var(--card)", border: "1px solid var(--border)" }}>
                <AlertCircle size={13} /> Algunos productos no tienen precio de costo; para ellos la utilidad se calcula como si costaran $0.
              </p>
            )}

            {/* ingresos y utilidad por periodo (día / semana / mes) */}
            <section className="mb-6">
              <div className="flex items-center justify-between mb-2">
                <p className="text-xs font-semibold flex items-center gap-1.5"><Wallet size={13} /> Ingresos y utilidad</p>
                <div className="flex gap-1">
                  {[["dia", "Día"], ["semana", "Semana"], ["mes", "Mes"]].map(([val, label]) => (
                    <button key={val} onClick={() => setPeriodoFinanzas(val)}
                      className="text-[11px] px-2.5 py-1 rounded-full font-semibold"
                      style={periodoFinanzas === val ? { background: "var(--primary)", color: "#fff" } : { border: "1px solid var(--border)", color: "var(--muted)" }}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="rounded-2xl p-4" style={{ background: "var(--primary)", color: "#fff" }}>
                  <p className="text-[11px] opacity-80 flex items-center gap-1"><TrendingUp size={11} /> Ingresos</p>
                  <p className="font-mono-price text-2xl font-semibold mt-1">{money(finanzas.resumenPorPeriodo[periodoFinanzas].ingresos)}</p>
                </div>
                <div className="rounded-2xl p-4" style={{ background: "var(--accent)", color: "var(--accentInk)" }}>
                  <p className="text-[11px] opacity-80">Utilidad bruta</p>
                  <p className="font-mono-price text-2xl font-semibold mt-1">{money(finanzas.resumenPorPeriodo[periodoFinanzas].utilidad)}</p>
                  <p className="text-[10px] opacity-70 mt-0.5">Falta restar gastos</p>
                </div>
              </div>
              <p className="text-[11px] mt-2" style={{ color: "var(--muted)" }}>
                {periodoFinanzas === "dia" ? "Hoy" : periodoFinanzas === "semana" ? "Esta semana (lunes a domingo)" : "Este mes"} · {finanzas.resumenPorPeriodo[periodoFinanzas].pedidos} pedido(s)
              </p>
            </section>

            {/* ingresos del día: tabla con selector de rango de fechas */}
            <section className="mb-6">
              <p className="text-xs font-semibold flex items-center gap-1.5 mb-2"><TrendingUp size={13} /> Ingresos del día</p>

              <div className="flex items-center gap-2 mb-3">
                <div className="flex-1">
                  <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Desde</label>
                  <div className="relative">
                    <Calendar size={13} className="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: "var(--muted)" }} />
                    <input type="date" value={ingresosDesde} onChange={(e) => setIngresosDesde(e.target.value)}
                      className="w-full rounded-lg pl-7 pr-2 py-2 text-xs outline-none" style={{ border: "1px solid var(--border)", background: "var(--card)", color: "var(--ink)" }} />
                  </div>
                </div>
                <div className="flex-1">
                  <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Hasta</label>
                  <div className="relative">
                    <Calendar size={13} className="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: "var(--muted)" }} />
                    <input type="date" value={ingresosHasta} onChange={(e) => setIngresosHasta(e.target.value)}
                      className="w-full rounded-lg pl-7 pr-2 py-2 text-xs outline-none" style={{ border: "1px solid var(--border)", background: "var(--card)", color: "var(--ink)" }} />
                  </div>
                </div>
              </div>

              {ingresosPedidosFiltrados.length === 0 ? (
                <p className="text-xs" style={{ color: "var(--muted)" }}>No hay pedidos en ese rango de fechas.</p>
              ) : (
                <div className="rounded-xl overflow-x-auto" style={{ border: "1px solid var(--border)" }}>
                  <table className="w-full text-[11px]" style={{ borderCollapse: "collapse", minWidth: 300 }}>
                    <thead>
                      <tr style={{ background: "var(--card)" }}>
                        <th className="text-left px-2 py-2 font-semibold" style={{ color: "var(--muted)" }}>Cliente</th>
                        <th className="text-left px-2 py-2 font-semibold" style={{ color: "var(--muted)", width: 92 }}>Fecha y hora</th>
                        <th className="text-right px-2 py-2 font-semibold" style={{ color: "var(--muted)" }}>Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {ingresosPedidosFiltrados.map((p) => {
                        const d = new Date(p.fechaISO);
                        return (
                          <tr key={p.id} style={{ borderTop: "1px solid var(--border)" }}>
                            <td className="px-2 py-2 font-mono-price whitespace-nowrap">{p.nombre}</td>
                            <td className="px-2 py-2 font-mono-price whitespace-nowrap" style={{ width: 92 }}>{fechaHoraCorta(d)}</td>
                            <td className="px-2 py-2 font-mono-price text-right whitespace-nowrap font-semibold">{money(p.total)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot>
                      <tr style={{ borderTop: "1px solid var(--border)", background: "var(--card)" }}>
                        <td className="px-2 py-2 font-semibold" colSpan={2}>Total</td>
                        <td className="px-2 py-2 text-right font-mono-price font-semibold">{money(ingresosPedidosFiltrados.reduce((s, p) => s + p.total, 0))}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              )}
            </section>

            {/* utilidad por pedido: tabla (fecha y hora fusionadas) */}
            <section className="mb-6">
              <p className="text-xs font-semibold flex items-center gap-1.5 mb-2"><Receipt size={13} /> Utilidad por pedido</p>

              <div className="flex items-center gap-2 mb-3">
                <div className="flex-1">
                  <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Desde</label>
                  <div className="relative">
                    <Calendar size={13} className="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: "var(--muted)" }} />
                    <input type="date" value={pedidosDesde} onChange={(e) => setPedidosDesde(e.target.value)}
                      className="w-full rounded-lg pl-7 pr-2 py-2 text-xs outline-none" style={{ border: "1px solid var(--border)", background: "var(--card)", color: "var(--ink)" }} />
                  </div>
                </div>
                <div className="flex-1">
                  <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Hasta</label>
                  <div className="relative">
                    <Calendar size={13} className="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: "var(--muted)" }} />
                    <input type="date" value={pedidosHasta} onChange={(e) => setPedidosHasta(e.target.value)}
                      className="w-full rounded-lg pl-7 pr-2 py-2 text-xs outline-none" style={{ border: "1px solid var(--border)", background: "var(--card)", color: "var(--ink)" }} />
                  </div>
                </div>
                {(pedidosDesde || pedidosHasta) && (
                  <button onClick={() => { setPedidosDesde(""); setPedidosHasta(""); }} className="self-end text-[11px] font-semibold px-2.5 py-2 rounded-lg" style={{ color: "var(--muted)", border: "1px solid var(--border)" }}>
                    Limpiar
                  </button>
                )}
              </div>

              {pedidosFiltrados.length === 0 ? (
                <p className="text-xs" style={{ color: "var(--muted)" }}>No hay pedidos en ese rango de fechas.</p>
              ) : (
                <div className="rounded-xl overflow-x-auto" style={{ border: "1px solid var(--border)" }}>
                  <table className="w-full text-[11px]" style={{ borderCollapse: "collapse", minWidth: 340 }}>
                    <thead>
                      <tr style={{ background: "var(--card)" }}>
                        <th className="text-left px-2 py-2 font-semibold" style={{ color: "var(--muted)" }}>Cliente</th>
                        <th className="text-left px-2 py-2 font-semibold" style={{ color: "var(--muted)", width: 92 }}>Fecha y hora</th>
                        <th className="text-right px-2 py-2 font-semibold" style={{ color: "var(--muted)" }}>Venta</th>
                        <th className="text-right px-2 py-2 font-semibold" style={{ color: "var(--muted)" }}>Utilidad</th>
                      </tr>
                    </thead>
                    <tbody>
                      {pedidosFiltrados.map((p) => {
                        const d = new Date(p.fechaISO);
                        return (
                          <tr key={p.id} style={{ borderTop: "1px solid var(--border)" }}>
                            <td className="px-2 py-2 font-mono-price whitespace-nowrap">{p.nombre}</td>
                            <td className="px-2 py-2 font-mono-price whitespace-nowrap" style={{ width: 92 }}>{fechaHoraCorta(d)}</td>
                            <td className="px-2 py-2 font-mono-price text-right whitespace-nowrap">{money(p.total)}</td>
                            <td className="px-2 py-2 font-mono-price text-right whitespace-nowrap font-semibold" style={{ color: "var(--primary)" }}>{money(p.utilidad)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot>
                      <tr style={{ borderTop: "1px solid var(--border)", background: "var(--card)" }}>
                        <td className="px-2 py-2 font-semibold" colSpan={2}>Total</td>
                        <td className="px-2 py-2 text-right font-mono-price font-semibold">{money(pedidosFiltrados.reduce((s, p) => s + p.total, 0))}</td>
                        <td className="px-2 py-2 text-right font-mono-price font-semibold" style={{ color: "var(--primary)" }}>{money(pedidosFiltrados.reduce((s, p) => s + p.utilidad, 0))}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              )}
            </section>

            {/* utilidad por cliente: tabla con selector de rango de fechas */}
            <section>
              <p className="text-xs font-semibold flex items-center gap-1.5 mb-2"><Users2 size={13} /> Utilidad por cliente</p>

              <div className="mb-3">
                <p className="text-[11px] font-semibold mb-1.5 flex items-center gap-1" style={{ color: "var(--muted)" }}>
                  <Calendar size={12} /> Filtrar por rango de fechas
                </p>
                <div className="flex items-center gap-2">
                  <div className="flex-1">
                    <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Desde</label>
                    <div className="relative">
                      <Calendar size={13} className="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: "var(--muted)" }} />
                      <input type="date" value={clientesDesde} onChange={(e) => setClientesDesde(e.target.value)}
                        className="w-full rounded-lg pl-7 pr-2 py-2 text-xs outline-none" style={{ border: "1px solid var(--border)", background: "var(--card)", color: "var(--ink)" }} />
                    </div>
                  </div>
                  <div className="flex-1">
                    <label className="text-[10px] font-semibold block mb-1" style={{ color: "var(--muted)" }}>Hasta</label>
                    <div className="relative">
                      <Calendar size={13} className="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: "var(--muted)" }} />
                      <input type="date" value={clientesHasta} onChange={(e) => setClientesHasta(e.target.value)}
                        className="w-full rounded-lg pl-7 pr-2 py-2 text-xs outline-none" style={{ border: "1px solid var(--border)", background: "var(--card)", color: "var(--ink)" }} />
                    </div>
                  </div>
                </div>
                {(clientesDesde || clientesHasta) && (
                  <button onClick={() => { setClientesDesde(""); setClientesHasta(""); }} className="text-[11px] font-semibold mt-2 px-3 py-1.5 rounded-lg" style={{ color: "var(--primary)", border: "1px solid var(--border)" }}>
                    Limpiar filtro de fechas
                  </button>
                )}
              </div>

              {porClienteFiltrado.length === 0 ? (
                <p className="text-xs" style={{ color: "var(--muted)" }}>No hay pedidos en ese rango de fechas.</p>
              ) : (
                <div className="rounded-xl overflow-x-auto" style={{ border: "1px solid var(--border)" }}>
                  <table className="w-full text-[11px]" style={{ borderCollapse: "collapse", minWidth: 340 }}>
                    <thead>
                      <tr style={{ background: "var(--card)" }}>
                        <th className="text-left px-2.5 py-2 font-semibold" style={{ color: "var(--muted)" }}>Cliente</th>
                        <th className="text-right px-2.5 py-2 font-semibold" style={{ color: "var(--muted)" }}>N.º pedidos</th>
                        <th className="text-right px-2.5 py-2 font-semibold" style={{ color: "var(--muted)" }}>Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {porClienteFiltrado.map((c) => (
                        <tr key={c.telefono || c.nombre} style={{ borderTop: "1px solid var(--border)" }}>
                          <td className="px-2.5 py-2 font-mono-price whitespace-nowrap">{c.nombre}</td>
                          <td className="px-2.5 py-2 font-mono-price text-right whitespace-nowrap">{c.pedidos}</td>
                          <td className="px-2.5 py-2 font-mono-price text-right whitespace-nowrap font-semibold" style={{ color: "var(--primary)" }}>{money(c.total)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </section>
          </div>
        )}
      </main>

      {/* barra flotante del carrito */}
      {view === "catalogo" && clienteActivo && totalItems > 0 && (
        <div className="fixed bottom-0 left-0 right-0 px-5 py-3.5 z-10" style={{ background: "var(--headerBg)", color: "var(--headerInk)", borderTop: "1px solid var(--border)" }}>
          <div className="max-w-3xl mx-auto flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 text-sm min-w-0">
              <ShoppingCart size={17} style={{ color: "var(--primary)", flexShrink: 0 }} />
              <span className="whitespace-nowrap">{totalItems} {totalItems === 1 ? "producto" : "productos"}</span>
              <span className="font-mono-price font-semibold whitespace-nowrap">{money(totalPedido)}</span>
            </div>
            <div className="flex items-center gap-2 flex-shrink-0">
              <button onClick={vaciarCarrito} className="text-xs font-semibold px-2.5 py-2 rounded-lg flex items-center gap-1"
                style={{ border: "1px solid var(--border)", color: "var(--headerInk)" }}>
                <Trash2 size={13} /> Vaciar
              </button>
              <button onClick={irACheckout} className="text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-1.5"
                style={{ background: "var(--primary)", color: "#fff" }}>
                Comprar ahora <ChevronRight size={15} />
              </button>
            </div>
          </div>
        </div>
      )}

      {/* modal: fuera de horario de servicio */}
      {showHorarioModal && (
        <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-0 sm:p-5" style={{ background: "rgba(0,0,0,0.45)" }}>
          <div className="w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5" style={{ background: "var(--card)", color: "var(--ink)" }}>
            <div className="flex items-center gap-2 mb-2">
              <div className="w-10 h-10 rounded-full flex items-center justify-center" style={{ background: "var(--bg)" }}>
                <XCircle size={20} style={{ color: "#B14A3A" }} />
              </div>
              <h2 className="font-display text-xl">Fuera de horario de servicio</h2>
            </div>
            <p className="text-sm mb-4" style={{ color: "var(--muted)" }}>
              Estamos cerrados en este momento. Atendemos {DIAS.filter((d) => horario.dias[d.key]).map((d) => d.label).join(", ")} de {horario.apertura} a {horario.cierre}{cruzaMedianoche(horario) ? " del día siguiente" : ""}.
              Nuestra próxima atención es {proximaAtencion(horario).texto}.{horario.atenderFuera ? " ¡Pero es posible comprar ahora!" : ""}
            </p>

            <button onClick={programarParaProximoHorario} className="w-full rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5 mb-2"
              style={{ background: "var(--primary)", color: "#fff" }}>
              <CalendarClock size={15} /> Programar para {proximaAtencion(horario).texto}
            </button>

            {horario.atenderFuera && (
              <button onClick={comprarConRecargo} className="w-full rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5 mb-2"
                style={{ background: "var(--accent)", color: "var(--accentInk)" }}>
                Comprar ahora
              </button>
            )}

            <button onClick={() => setShowHorarioModal(false)} className="w-full text-xs py-1.5" style={{ color: "var(--muted)" }}>
              Cancelar
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>

<script>
  // Compilamos manualmente el bloque anterior (type="text/plain" para que el
  // navegador no intente ejecutarlo tal cual) usando el runtime "classic" de JSX,
  // que produce React.createElement(...) en vez de "import ... from react/jsx-runtime".
  // Esto evita el error "Cannot use import statement outside a module".
  (function () {
    try {
      var codigoFuente = document.getElementById("app-source").textContent;
      var salida = Babel.transform(codigoFuente, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var script = document.createElement("script");
      script.textContent = salida;
      document.body.appendChild(script);
    } catch (e) {
      mostrarErrorCarga("Error al iniciar la app: " + (e && e.message ? e.message : e));
    }
  })();
</script>
</body>
</html>
